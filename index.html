<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Derivative Basics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full text-center border border-gray-700">
        <h1 class="text-2xl font-bold text-gray-300 mb-6">Derivative Basics</h1>
        
        <p class="text-gray-400">Current Stock Price</p>
        <div id="price" class="text-7xl font-bold text-white mb-8">$100</div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <!-- Long Position -->
            <div class="bg-gray-700 p-4 rounded-lg border-t-4 border-blue-500 shadow-inner">
                <h2 class="text-blue-400 font-bold mb-2 tracking-wide">IF LONG</h2>
                <p class="text-xs text-gray-400 mb-2 uppercase">You want price UP</p>
                <div id="long-result" class="text-3xl font-bold text-gray-300">$0</div>
            </div>

            <!-- Short Position -->
            <div class="bg-gray-700 p-4 rounded-lg border-t-4 border-purple-500 shadow-inner">
                <h2 class="text-purple-400 font-bold mb-2 tracking-wide">IF SHORT</h2>
                <p class="text-xs text-gray-400 mb-2 uppercase">You want price DOWN</p>
                <div id="short-result" class="text-3xl font-bold text-gray-300">$0</div>
            </div>
        </div>

        <div class="space-y-4">
            <button onclick="takeStep()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-lg text-lg transition duration-200 shadow-lg">
                🎲 Take a Random Step (±$10)
            </button>
            <button onclick="reset()" class="w-full bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                🔄 Reset to Start
            </button>
        </div>
    </div>

    <script>
        const startPrice = 100;
        let currentPrice = startPrice;

        function takeStep() {
            // Randomly pick +10 or -10
            const change = Math.random() >= 0.5 ? 10 : -10;
            currentPrice += change;
            
            // Prevent negative stock price
            if (currentPrice < 0) currentPrice = 0; 

            // Calculate profit or loss from the start position
            const longProfit = currentPrice - startPrice;
            const shortProfit = startPrice - currentPrice;

            // Update Price Display
            document.getElementById('price').innerText = `$${currentPrice}`;
            
            // Update Long Display (Green for profit, Red for loss)
            const longEl = document.getElementById('long-result');
            longEl.innerText = (longProfit > 0 ? '+' : '') + `$${longProfit}`;
            longEl.className = `text-3xl font-bold ${longProfit > 0 ? 'text-green-400' : (longProfit < 0 ? 'text-red-400' : 'text-gray-300')}`;

            // Update Short Display (Green for profit, Red for loss)
            const shortEl = document.getElementById('short-result');
            shortEl.innerText = (shortProfit > 0 ? '+' : '') + `$${shortProfit}`;
            shortEl.className = `text-3xl font-bold ${shortProfit > 0 ? 'text-green-400' : (shortProfit < 0 ? 'text-red-400' : 'text-gray-300')}`;
        }

        function reset() {
            currentPrice = startPrice;
            document.getElementById('price').innerText = `$${currentPrice}`;
            
            document.getElementById('long-result').innerText = `$0`;
            document.getElementById('long-result').className = 'text-3xl font-bold text-gray-300';
            
            document.getElementById('short-result').innerText = `$0`;
            document.getElementById('short-result').className = 'text-3xl font-bold text-gray-300';
        }
    </script>
</body>
</html>
